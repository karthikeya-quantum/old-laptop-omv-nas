services:
  stirling-pdf:
    container_name: stirling-pdf
    image: stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=en_GB
      - TZ=Asia/Kolkata
    volumes:
      - /srv/dev-disk-by-uuid-<APPDATA_UUID>/appdata/stirling-pdf/trainingData:/usr/share/tessdata
      - /srv/dev-disk-by-uuid-<APPDATA_UUID>/appdata/stirling-pdf/configs:/configs
