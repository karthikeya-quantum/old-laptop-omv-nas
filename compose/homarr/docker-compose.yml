services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:v2
    restart: unless-stopped
    ports:
      - "7575:7575"
    environment:
      - SECRET_ENCRYPTION_KEY=<GENERATE_64_CHAR_HEX_KEY>
      - TZ=Asia/Kolkata
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/dev-disk-by-uuid-<APPDATA_UUID>/appdata/homarr/appdata:/appdata
    extra_hosts:
      - "homecloud.lan:<SERVER_LAN_IP>"
